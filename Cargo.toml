[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
jevons-api = { path = "crates/jevons-api" }
jevons-audio = { path = "crates/jevons-audio" }
jevons-burn = { path = "crates/jevons-burn" }
jevons-core = { path = "crates/jevons-core" }
jevons-decision = { path = "crates/jevons-decision" }
jevons-desktop-core = { path = "crates/jevons-desktop-core" }
jevons-desktop-protocol = { path = "crates/jevons-desktop-protocol" }
jevons-diffusion = { path = "crates/jevons-diffusion" }
jevons-formats = { path = "crates/jevons-formats" }
jevons-gemma4-diffusion = { path = "crates/jevons-gemma4-diffusion" }
jevons-generative = { path = "crates/jevons-generative" }
jevons-kernels = { path = "crates/jevons-kernels" }
jevons-machine = { path = "crates/jevons-machine" }
jevons-models = { path = "crates/jevons-models", default-features = false }
jevons-nemotron-diffusion = { path = "crates/jevons-nemotron-diffusion" }
jevons-parakeet = { path = "crates/jevons-parakeet" }
jevons-speech = { path = "crates/jevons-speech" }
jevons-tokenizer = { path = "crates/jevons-tokenizer" }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
toml = "1"
# The inspector saves an edited extract into its node file, keeping comments and layout.
toml_edit = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Desktop agent.
# Agents and MCP: default features off, so no model providers, skills or TLS come in.
adk-agent = { version = "2.2", default-features = false }
adk-core = { version = "2.2", default-features = false }
adk-runner = { version = "2.2", default-features = false }
adk-session = { version = "2.2", default-features = false }
adk-tool = { version = "2.2", default-features = false, features = ["mcp"] }
active-win-pos-rs = "0.11"
arboard = "3.6"
cpal = "0.18"
device_query = "4"
directories = "6"
anyrender_vello = { version = "=0.6.2", default-features = false }
blitz-shell = { version = "=0.2.3", default-features = false }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
# `hot-reload` is required: 0.7.10 does not build without it.
# svg paints inline SVG icons (without it Blitz parses them but draws nothing); clipboard gives
# text fields copy, cut and paste.
dioxus-native = { version = "=0.7.10", default-features = false, features = ["hot-reload", "system-fonts", "svg", "clipboard"] }
peniko = "=0.5.0"
winit = "=0.30.13"
enigo = "0.6"
global-hotkey = "0.8"
globset = "0.4"
notify = "8"
# Task state machines in jevons-desktop: the Mermaid-like `.fsm` parser and model only (no egui
# editor, no Node.js layout).
oxidate-fsm = { version = "0.1.0", default-features = false }
# Markdown answers in the feedback bubble: the parser only (no HTML writer, no CLI).
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.11"
# Native TLS: SChannel on Windows and Security.framework on macOS need no C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "json", "multipart", "stream"] }
rdev = "0.5"
rfd = "0.17"
# Automation scripts: pure Rust, Send + Sync, with serde values and signature metadata.
rhai = { version = "1.26", features = ["sync", "serde", "metadata", "internals"] }
schemars = "1"
sha2 = "0.10"
# Process names for the windows investigations may read (Windows).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tao = "0.37"
tokio-tungstenite = "0.29"
tray-icon = "0.25"
uiautomation = "0.25"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# File and line in panic backtraces (in a separate .pdb on Windows, so the binaries stay small).
debug = "line-tables-only"

# Windows HIP library names; see third_party/cubecl-hip-sys/README.jevons.md.
[patch.crates-io]
cubecl-hip-sys = { path = "third_party/cubecl-hip-sys" }
# derive_more imports that clash with cubecl's derive_more features; see
# third_party/stylo/README.jevons.md.
stylo = { path = "third_party/stylo" }
# Stale ElementId mappings that drop live nodes; see third_party/dioxus-native-dom/README.jevons.md.
dioxus-native-dom = { path = "third_party/dioxus-native-dom" }
# Moving a node within its parent dropped it; see third_party/blitz-dom/README.jevons.md.
blitz-dom = { path = "third_party/blitz-dom" }
# A black text caret, invisible on the dark theme; see third_party/blitz-paint/README.jevons.md.
blitz-paint = { path = "third_party/blitz-paint" }
