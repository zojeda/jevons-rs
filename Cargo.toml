[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
jevons-api = { path = "crates/jevons-api" }
jevons-audio = { path = "crates/jevons-audio" }
jevons-burn = { path = "crates/jevons-burn" }
jevons-core = { path = "crates/jevons-core" }
jevons-decision = { path = "crates/jevons-decision" }
jevons-desktop-core = { path = "crates/jevons-desktop-core" }
jevons-diffusion = { path = "crates/jevons-diffusion" }
jevons-formats = { path = "crates/jevons-formats" }
jevons-gemma4-diffusion = { path = "crates/jevons-gemma4-diffusion" }
jevons-generative = { path = "crates/jevons-generative" }
jevons-kernels = { path = "crates/jevons-kernels" }
jevons-models = { path = "crates/jevons-models", default-features = false }
jevons-nemotron-diffusion = { path = "crates/jevons-nemotron-diffusion" }
jevons-parakeet = { path = "crates/jevons-parakeet" }
jevons-speech = { path = "crates/jevons-speech" }
jevons-tokenizer = { path = "crates/jevons-tokenizer" }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
toml = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Desktop agent.
active-win-pos-rs = "0.11"
arboard = "3.6"
cpal = "0.18"
device_query = "4"
directories = "6"
anyrender_vello = { version = "=0.6.2", default-features = false }
blitz-shell = { version = "=0.2.3", default-features = false }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
# `hot-reload` is required: 0.7.10 does not build without it.
dioxus-native = { version = "=0.7.10", default-features = false, features = ["hot-reload", "system-fonts"] }
peniko = "=0.5.0"
winit = "=0.30.13"
enigo = "0.6"
global-hotkey = "0.8"
globset = "0.4"
notify = "8"
regex = "1.11"
# Native TLS: SChannel on Windows and Security.framework on macOS need no C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "json", "multipart", "stream"] }
rfd = "0.17"
sha2 = "0.10"
tao = "0.37"
tokio-tungstenite = "0.29"
tray-icon = "0.25"
uiautomation = "0.25"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# File and line in panic backtraces (in a separate .pdb on Windows, so the binaries stay small).
debug = "line-tables-only"

# Windows HIP library names; see third_party/cubecl-hip-sys/README.jevons.md.
[patch.crates-io]
cubecl-hip-sys = { path = "third_party/cubecl-hip-sys" }
# derive_more imports that clash with cubecl's derive_more features; see
# third_party/stylo/README.jevons.md.
stylo = { path = "third_party/stylo" }
