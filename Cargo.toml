[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
jevons-audio = { path = "crates/jevons-audio" }
jevons-burn = { path = "crates/jevons-burn" }
jevons-core = { path = "crates/jevons-core" }
jevons-gemma4-diffusion = { path = "crates/jevons-gemma4-diffusion" }
jevons-engine = { path = "crates/jevons-engine" }
jevons-formats = { path = "crates/jevons-formats" }
jevons-kernels = { path = "crates/jevons-kernels" }
jevons-tokenizer = { path = "crates/jevons-tokenizer" }
jevons-nemotron-diffusion = { path = "crates/jevons-nemotron-diffusion" }
jevons-parakeet = { path = "crates/jevons-parakeet" }
jevons-models = { path = "crates/jevons-models", default-features = false }
jevons-system-one = { path = "crates/jevons-system-one" }
jevons-openai = { path = "crates/jevons-openai" }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
toml = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Windows HIP library names; see third_party/cubecl-hip-sys/README.jevons.md.
[patch.crates-io]
cubecl-hip-sys = { path = "third_party/cubecl-hip-sys" }
