[package]
name = "jevons-desktop-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "What the jevons desktop server and its client say to each other: the context of a take, the effects the server asks for, and their answers."

[features]
# The WebSocket stream's two ends: a client connects, a server accepts.
client = ["dep:tokio-tungstenite"]
server = ["dep:axum"]

[dependencies]
axum = { workspace = true, features = ["ws"], optional = true }
futures-util = { workspace = true, features = ["sink", "std"] }
globset.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
toml.workspace = true

[lints]
workspace = true
