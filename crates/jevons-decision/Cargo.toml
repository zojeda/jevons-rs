[package]
name = "jevons-decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jevons-scm"
path = "src/main.rs"
required-features = ["models"]

[[example]]
name = "golden"
required-features = ["models"]

[features]
default = ["models"]
# Load the built-in diffusion models (the GPU tests, the CLI and the golden example).
models = ["jevons-diffusion/models"]

[dependencies]
jevons-core.workspace = true
jevons-diffusion.workspace = true
clap.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jevons-diffusion = { workspace = true, features = ["testing"] }
image.workspace = true

[lints]
workspace = true
