[package]
name = "jevons-gemma4-diffusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jevons-formats.workspace = true
jevons-kernels.workspace = true
jevons-tokenizer.workspace = true
thiserror.workspace = true
half = "2.7"
bytemuck = "1"
cubecl = { version = "=0.11.0-pre.4", features = ["hip"] }
# hiprtc C++ code generation, as in CubeCL 0.10 (the default LLVM path rejects some kernels).
cubecl-hip = { version = "=0.11.0-pre.4", default-features = false, features = ["cpp"] }

[dev-dependencies]
image.workspace = true
serde_json.workspace = true
# The spike of issue #5 (src/model/burn_spike.rs): the kernels as Burn backend extensions.
jevons-burn.workspace = true
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "rocm", "fusion", "autotune", "extension"] }
burn-cubecl = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "hip", "fusion", "autotune"] }

[features]
# The spike of issue #5: the kernel tests on a wgpu device (SPIR-V on Vulkan) with
# SPIKE_RUNTIME=wgpu.
spike-wgpu = ["cubecl/vulkan"]

[[example]]
name = "gguf_info"

[[example]]
name = "prefix_check"

[[example]]
name = "golden_dump"

[[example]]
name = "vision_check"

[lints]
workspace = true
