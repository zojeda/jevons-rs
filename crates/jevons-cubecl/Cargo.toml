[package]
name = "jevons-cubecl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
hip = ["dep:bytemuck", "dep:burn-rocm", "dep:burn-tensor", "dep:burn-cubecl", "dep:cubecl", "dep:cubek"]

[dependencies]
jevons-formats.workspace = true
jevons-tokenizer.workspace = true
thiserror.workspace = true
burn-rocm = { version = "=0.21.0", optional = true }
burn-tensor = { version = "=0.21.0", optional = true }
half = "2.7"
bytemuck = { version = "1", optional = true }
burn-cubecl = { version = "=0.21.0", optional = true }
cubecl = { version = "=0.10.0", features = ["hip"], optional = true }
cubek = { version = "=0.2.0", default-features = false, features = ["matmul", "stdlib", "std"], optional = true }

[dev-dependencies]
image.workspace = true
serde_json.workspace = true

[[example]]
name = "hip_probe"
required-features = ["hip"]

[[example]]
name = "q4k_bench"
required-features = ["hip"]

[[example]]
name = "expert_tune"
required-features = ["hip"]

[[example]]
name = "routed_bench"
required-features = ["hip"]

