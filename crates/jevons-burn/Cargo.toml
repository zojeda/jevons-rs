[package]
name = "jevons-burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jevons-formats.workspace = true
jevons-kernels.workspace = true
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "rocm", "fusion", "autotune", "extension"] }
burn-cubecl = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "hip", "fusion", "autotune"] }
cubecl = { version = "=0.11.0-pre.4", features = ["hip"] }
# The default pliron/LLVM HIP compiler panics on BF16 kernels; hiprtc C++ works.
cubecl-hip = { version = "=0.11.0-pre.4", default-features = false, features = ["cpp"] }
half = "2.7"

[features]
# Burn's CPU device, for unit tests of model code built on these layers.
flex = ["burn/flex"]

[lints]
workspace = true

[dev-dependencies]
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "rocm", "fusion", "autotune", "extension", "flex"] }
