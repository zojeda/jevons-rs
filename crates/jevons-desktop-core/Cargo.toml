[package]
name = "jevons-desktop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Platform-free core of the jevons desktop dictation agent: traits, profiles, pipeline and API client."

[features]
# Fakes for pipeline tests and the headless replay mode.
testing = []

[dependencies]
jevons-audio.workspace = true
base64.workspace = true
directories.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
globset.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }

[lints]
workspace = true
