[package]
name = "jevons-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jevons-scm"
path = "src/main.rs"
required-features = ["models"]

[[example]]
name = "golden"
required-features = ["models"]

[features]
default = ["models"]
# Architecture detection and the built-in model implementations.
models = ["dep:jevons-models", "jevons-models/gemma4", "jevons-models/nemotron", "jevons-models/parakeet"]

[dependencies]
jevons-core.workspace = true
jevons-models = { workspace = true, optional = true }
clap.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true
