# The flows root: the app's machine (root.fsm). It waits in `idle` for the user to speak; each
# take is `said` there, and leads to the agent whose description fits (each agent's description
# is in its agent.toml, which also holds its [prefer] rules). The agent gets the take, and the
# root is back in `idle` at once.
question = """
What does the user want done with what they said? Decide who the words are for: the application \
(text to type there, including questions meant for the people they write to) or you, the \
assistant listening (a question to answer for them)."""
# When the decision model is unsure (the agent it chose below 70%) or unavailable, the words are
# dictated: `[else]` in root.fsm.
min_probability = 0.7
# Everything the agents may call: `automations` runs any approved automation.
tools = ["script:*"]
