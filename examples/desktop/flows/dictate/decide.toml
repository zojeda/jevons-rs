description = """
The user is dictating words to type where they are working: a message, a note, a document, a \
shell command, or a prompt for an assistant inside the application (such as a coding agent in a \
terminal). That includes questions meant for the people they write to ("¿vienes a la \
reunión?", "can you review my PR?"). Or they say how to change the text there: rewrite, \
translate, shorten or fix the selection or the field."""
# The application decides the branch: the highest priority whose guard passes.
select = "rules"
fallback = "any"

# In a terminal the words are a command or a prompt, even when phrased as a question: dictate
# without asking the model (ask/ is still a choice when the words start with "Pregunta").
[prefer]
app = ["windowsterminal.exe", "wt.exe", "conhost.exe", "cmd.exe", "powershell.exe", "pwsh.exe", "alacritty*", "wezterm*", "kitty", "konsole", "gnome-terminal*", "xterm", "iterm*", "ghostty*", "warp*"]
