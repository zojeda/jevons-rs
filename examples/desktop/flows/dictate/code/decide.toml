# Code editors: never rewrite code.
description = "A code editor"
priority = 40
branches = "_actions"
only = ["insert", "verbatim"]
instructions = "The user is writing code or a code comment. Output plain text with no Markdown fences; keep identifiers exactly as spoken, in their usual casing."

[when]
app = ["code.exe", "code", "zed*", "rustrover*", "idea64.exe", "devenv.exe"]
