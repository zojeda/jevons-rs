# Slack: the answer reads the open conversation (ask's Slack extracts, by XPath: no model).
# Rows are the messages Slack has rendered; a follow-up from the same author has no author name.
description = "In Slack"
output = "bubble"
priority = 10
instructions = """
The user is in Slack, in the conversation {slack_conversation}. Its latest messages, oldest first:
{slack_messages}
Their channels and direct messages: {slack_channels}"""

[when]
app = ["slack.exe"]
