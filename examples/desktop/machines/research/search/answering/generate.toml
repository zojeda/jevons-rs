output = "bubble"
max_output_tokens = 400
prompt = """
The user asked: {transcript}

Web search results (JSON):
{searching}

Answer from the results in a few sentences. Then list the results that matter, numbered in the \
order the search ranked them, each with its title and address, so the user can ask for one by its \
number. Use only what the results hold: \
when they hold none, say the search found nothing and suggest other words, and never list a result \
that is not in them."""
