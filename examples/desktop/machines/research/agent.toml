# The research agent: it starts web searches, and routes what you say next to the search that
# waits. Copy this folder into your flows folder and add it to root.fsm (see the README).
description = """
The user asks to search the web for something, or says something about a search whose results \
are shown: to open one of them, to search for something else, or that they are done with it."""
# Everything its tasks may call.
tools = ["web_search", "open_url"]

# A search starts only when the words start with "Search", "Busca", "Buscar" or "Búscame",
# chosen with no model. Any other take is for this agent only while one of its searches waits.
[guards.search]
when = { transcript = "(?i)^\\W*(search|b[uú]sca(r|me|lo|la|los|las|nos)?)\\b" }
prefer = { transcript = "(?i)^\\W*(search|b[uú]sca(r|me|lo|la|los|las|nos)?)\\b" }
