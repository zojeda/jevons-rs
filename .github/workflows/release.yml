name: Release

# Every push to main is checked, built for Linux and Windows, and published as a release
# (tag v0.1.<run number>). Pull requests run the same check and builds without publishing.
# The binaries load ROCm/HIP at run time; see the release notes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # HIP binding layout compiled into the binaries: the ROCm version the service is tested on,
  # which the packages name.
  JEVONS_HIP_VERSION: "7.2.53211"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pin the HIP bindings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          rustc -O .github/hipconfig.rs -o "$RUNNER_TEMP/bin/hipconfig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the desktop libraries
        # jevons-desktop: tray (GTK, AppIndicator, xdo), microphone (ALSA), TLS (OpenSSL).
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        # One row per platform and GPU backend; .github/package-name.sh names each package.
        # A CUDA or WGPU build is one more row (backend: cuda or wgpu) with its setup step next
        # to "Pin the HIP bindings", once a Cargo feature selects that backend for the build.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            backend: hip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            backend: hip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the build
        shell: bash
        env:
          # Runs on main publish VERSION; pull requests and other branches build pre-releases.
          RELEASE: ${{ github.ref == 'refs/heads/main' && env.VERSION || '' }}
        run: bash .github/package-name.sh jevons-rs ${{ matrix.target }} ${{ matrix.backend }} "$RELEASE" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.backend }}
      - name: Pin the HIP bindings
        if: matrix.backend == 'hip'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          rustc -O .github/hipconfig.rs -o "$RUNNER_TEMP/bin/hipconfig${{ runner.os == 'Windows' && '.exe' || '' }}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libssl-dev
      - name: Build
        shell: bash
        env:
          JEVONS_BUILD: ${{ env.VERSION }} (${{ github.sha }})
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p jevons-rs --bin jevons-rs -p jevons-desktop --bin jevons-desktop
      - name: Package
        shell: bash
        run: |
          release="target/${{ matrix.target }}/release"
          mkdir -p "dist/$PACKAGE"
          # Both executables carry the package's name after their own (local builds keep the
          # short names): jevons-rs-<build> and jevons-desktop-<build>.
          cp "$release/jevons-rs$EXE_SUFFIX" "dist/$PACKAGE/$PACKAGE$EXE_SUFFIX"
          cp "$release/jevons-desktop$EXE_SUFFIX" "dist/$PACKAGE/jevons-desktop${PACKAGE#jevons-rs}$EXE_SUFFIX"
          cp README.md jevons.example.toml jevons-desktop.example.toml "dist/$PACKAGE/"
          cp -r examples/desktop/flows "dist/$PACKAGE/flows"
          echo "Needs $REQUIRES." > "dist/$PACKAGE/REQUIREMENTS.txt"
          cd dist
          case "$ARCHIVE" in
            *.zip) 7z a -tzip "$ARCHIVE" "$PACKAGE" > /dev/null ;;
            *) tar czf "$ARCHIVE" "$PACKAGE" ;;
          esac
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          rm -r "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only pushes to main publish; `act` runs the build jobs locally without publishing.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.act }}
    env:
      VERSION: 0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          packages=$(for f in dist/*.tar.gz dist/*.zip; do echo "- \`${f#dist/}\`"; done)
          rocm=${JEVONS_HIP_VERSION%.*}
          cat > notes.md <<NOTES
          Build of ${GITHUB_SHA::7} on main.

          $packages

          Packages are named product-version-os-arch-backend, and the executables in them,
          \`jevons-rs\` (the service) and \`jevons-desktop\`, carry the same version, OS, CPU
          and GPU backend after their own name. The backend names the driver release a build
          needs, which REQUIREMENTS.txt spells out. Linux builds need glibc 2.35 or newer.

          The \`hip-rocm$rocm\` builds need an AMD RDNA3-class GPU and load ROCm/HIP at run
          time: \`amdhip64\` and \`hiprtc\` from \`ROCM_PATH\`/\`HIP_PATH\` (or their \`lib\`
          folder) or the system library path. The HIP bindings match ROCm $rocm. The Windows
          build is untested on a GPU: it needs \`amdhip64.dll\` (installed with the AMD driver)
          and \`hiprtc.dll\` from the AMD HIP SDK, which may have to be copied next to the
          executable under that name.
          Models are not included; copy \`jevons.example.toml\` to \`jevons.toml\` to configure
          the service. \`jevons-desktop\` is the tray dictation app (see docs/desktop.md): it can
          download the models itself, and \`flows/\` is its built-in flow tree.
          NOTES
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "jevons-rs $VERSION" \
            --notes-file notes.md
