name: Specs

# Checks that specs/ matches the code: every test a spec cites exists, every crate has a spec,
# and the index links every spec. See specs/README.md.
on:
  push:
    branches: [dev, main]
    paths: &paths
      - "specs/**"
      - "crates/**"
      - "scripts/check-specs.py"
      - ".github/workflows/specs.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-specs.py --report
