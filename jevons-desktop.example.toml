# The jevons desktop app's settings: dictation, the voice, what a take may read, and
# automations. The Settings panel writes this file; every field is optional.
# Default location: the platform configuration folder (for example
# %APPDATA%\jevons\config\jevons-desktop.toml or ~/.config/jevons/jevons-desktop.toml).
# The server's settings (providers, models, the flows folder, tools) are in jevons-server.toml,
# next to it.

[dictation]
# Push-to-talk (and the branch hotkeys); the take runs when you finish.
hotkey = "Ctrl+Alt+Space"
# "hold": listen while the hotkey is held. "toggle": press to start, press again to finish.
hotkey_mode = "hold"
# Live dictation: the bubble shows the words as you speak; the text is inserted when you finish.
live_hotkey = "F9"
live_hotkey_mode = "hold"
# Windows: a double-tap on Bluetooth headphones starts live dictation, which ends after a quiet
# pause (or at the next double-tap); a single tap still plays and pauses music.
# headphones = true
# Saying this word alone, then pausing, starts live dictation, which ends after a quiet pause.
# The microphone stays open between takes; what it hears is only matched, never kept or logged.
# Settings -> Teach it records how the speech model writes your way of saying it.
# wake_word = "Jevons"
# A bubble above the tray icon shows what dictation hears and does.
live_feedback = true
# inspector_hotkey = "Ctrl+Alt+I"
# Hotkeys that start the take at a branch of the flow tree instead of its root:
# [dictation.branch_hotkeys]
# ask = "Ctrl+Alt+A"
# microphone = "Microphone Array"
# language = "es"
# Ask the decision model at the flow tree's model decisions (off: take their fallbacks).
decide = true
max_output_tokens = 1024

# The voice: jevons reads aloud the answers of the flow leaves that ask for it
# (`output = "voice"`, as the built-in assistant's do), once a voice model is served. Others in
# the room hear it. It never speaks while it listens, and it stops when you start a take.
[voice]
# false: those answers are shown in the bubble and nothing is said.
speak = true
# The output device; the default one when left out.
# output = "Headphones"

[privacy]
max_context_chars = 2000
read_clipboard = false
# Investigations read the window a take started in. To let them read other windows too (such as
# "is Slack open, and what did Ana say?"), allow it and list the applications:
read_other_windows = false
# readable_apps = ["slack.exe", "chrome.exe"]

# Tools that run on this machine, which flow nodes may call (tool.toml). Flow files
# can use these, never add them. Each asks in the bubble before it runs unless confirm = false
# here, whatever the server asks; `allow` keeps a tool to the flow nodes it names. {argument}
# takes a call's argument; ${env:NAME} an environment variable.
# [tools.search]
# kind = "open"                       # open | command | http
# description = "Searches the web for a query"
# url = "https://duckduckgo.com/?q={query}"
# arguments = { query = "What to search for" }
# confirm = false
#
# MCP servers that run on this machine, started on demand over standard input and output; their
# tools are server:tool.
# [mcp.fs]
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "C:/Users/me/notes"]
# unconfirmed = ["read_file", "list_directory"]   # these run without asking

# Automations: scripts in the library folder (`automations` next to this file), written from
# recorded demonstrations. An automation runs only once approved in the app, which pins its
# version here; an edited script needs approving again.
# Coming soon: automations are off, and the tray menu says so, until `enabled = true`.
# [automation]
# enabled = true                                # try them: record, approve and run
# record_hotkey = "Ctrl+Alt+R"                  # start/stop recording; hold it to add a note
# unconfirmed = ["slack-post"]                  # these run without asking first
# [automation.hotkeys]
# slack-post = "Ctrl+Alt+P"                     # say the arguments after pressing it
# [automation.allow]
# slack-post = ["run", "ask/*"]                 # the flow nodes that may call it

# What an outside agent (Claude Code, through the server's control API) may do at this desk. It
# reads and acts only in the applications listed here; its first action in each asks in the
# bubble, and a yes holds until it has been quiet for 10 minutes. It never acts while you dictate
# or hold a key, and never reads or types into a password field.
# [control]
# apps = ["slack.exe", "notepad.exe"]   # process-name globs; none by default
# confirm = "once"                      # once | every | never
# bubble = true                         # it may show messages, ask, and read the bubble (and so
#                                       # what you dictated while a take shows there)
# max_chars = 20000                     # the most text one read returns
