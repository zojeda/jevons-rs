# The jevons desktop app's settings: dictation, what a take may read, and automations. The
# Settings panel writes this file; every field is optional.
# Default location: the platform configuration folder (for example
# %APPDATA%\jevons\config\jevons-desktop.toml or ~/.config/jevons/jevons-desktop.toml).
# The server's settings (providers, models, the flows folder, tools) are in jevons-server.toml,
# next to it.

[dictation]
# Push-to-talk (and the branch hotkeys); the take runs when you finish.
hotkey = "Ctrl+Alt+Space"
# "hold": listen while the hotkey is held. "toggle": press to start, press again to finish.
hotkey_mode = "hold"
# Live dictation: the bubble shows the words as you speak; the text is inserted when you finish.
live_hotkey = "F9"
live_hotkey_mode = "hold"
# A bubble above the tray icon shows what dictation hears and does.
live_feedback = true
# inspector_hotkey = "Ctrl+Alt+I"
# Hotkeys that start the take at a branch of the flow tree instead of its root:
# [dictation.branch_hotkeys]
# ask = "Ctrl+Alt+A"
# microphone = "Microphone Array"
# language = "es"
# Ask the decision model at the flow tree's model decisions (off: take their fallbacks).
decide = true
max_output_tokens = 1024

[privacy]
max_context_chars = 2000
read_clipboard = false
# Investigations read the window a take started in. To let them read other windows too (such as
# "is Slack open, and what did Ana say?"), allow it and list the applications:
read_other_windows = false
# readable_apps = ["slack.exe", "chrome.exe"]

