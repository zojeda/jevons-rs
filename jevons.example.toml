# Settings for the jevons-rs server. Copy to ./jevons.toml or ~/.config/jevons/config.toml, or
# pass --config PATH (JEVONS_CONFIG). Every key is optional and named after its long flag;
# command-line flags and environment variables override the file. Relative paths resolve
# against this file's directory, and `~/` against the home directory.

# GGUF file (DiffusionGemma) or Hugging Face checkpoint directory (Nemotron-Labs-Diffusion).
model = "~/models/nemotron-labs-diffusion-vlm-8b"
# arch = "auto"                  # or gemma4-diffusion, nemotron-diffusion
# mmproj = "~/models/diffusiongemma/mmproj.gguf"   # DiffusionGemma image input only
# Speech-to-text model (Parakeet TDT checkpoint directory): /v1/audio/transcriptions and the
# /v1/realtime WebSocket. Set it with or without `model`.
# speech_model = "~/models/parakeet-tdt-0.6b-v3"
# speech_model_id = "parakeet-tdt-0.6b-v3"   # defaults to the model's own ID
# speech_queue_capacity = 8
# max_audio_seconds = 3600.0    # longest upload or Realtime buffer
# realtime = true
bind = "127.0.0.1:8080"
# model_id = "nemotron-diffusion-8b"   # defaults to the model's own ID

# Bearer key for every endpoint except /health. Prefer TYPESAFE_API_KEY in the environment;
# never commit a key.
# api_key = ""

# main_gpu = 0
context_size = 8192
# batch_size = 512
# prompt_cache = true
# seed = 42
# queue_capacity = 8

# How thoughts and OpenAI-compatible answers are generated: "diffusion", "self-speculation"
# (Nemotron: diffusion drafts verified causally, the greedy autoregressive text, about twice
# as fast as diffusion) or "autoregressive".
decoding = "self-speculation"
