[package]
name = "dual-cubecl"
version = "0.0.0"
edition = "2024"
publish = false

# Item 8: cubecl 0.10 (current jevons-cubecl) and 0.11-pre.4 (Burn 0.22) in one binary.
[workspace]

[dependencies]
cubecl010 = { package = "cubecl", version = "=0.10.0", features = ["hip"] }
cubecl011 = { package = "cubecl", version = "=0.11.0-pre.4", features = ["hip"] }
cubecl-hip011 = { package = "cubecl-hip", version = "=0.11.0-pre.4", default-features = false, features = ["cpp"] }
